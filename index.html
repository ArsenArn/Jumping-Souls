<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bouncy Ball Game</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="gameCanvas"></canvas>
  <div id="startMenu">
    <div id="menuButtons">
      <button id="menuSoundToggle" class="icon-btn" aria-pressed="true" title="Sound">🔊</button>
      <button id="menuMusicToggle" class="icon-btn" aria-pressed="true" title="Music">🎵</button>
    </div>
    <div id="menuTutorial">
      <div class="tutorial-title">How to Play</div>
      <div class="tutorial-line">⬅️ / ➡️ or A / D — Move</div>
      <div class="tutorial-line">⬆️ or W or Space — Jump</div>
      <div class="tutorial-line">🧠 Attack enemies only from above, or you take damage.</div>
    </div>
    <button id="startBtn">START</button>
  </div>
  <div id="characterSelect" class="hidden">
    <div class="character-title">Choose a character</div>
    <div class="character-cards">
      <button class="character-card" data-character="1" aria-label="Character 1">
        <img src="visuals/Mask/Player_Mask_1.jpg" alt="Player 1">
      </button>
      <button class="character-card" data-character="2" aria-label="Character 2">
        <img src="visuals/Mask/Player_Mask_2.jpg" alt="Player 2">
      </button>
    </div>
  </div>
  <div id="skillsUI" style="
  position: absolute;
  top: 20px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  flex-direction: row;
  gap: 26px;
  z-index: 12;
"></div>

  <div id="gameOverScreen">
    <div>Game Over!</div>
    <div>Your Score: <span id="finalScore"></span></div>
    <button id="restartBtn">Restart</button>
  </div>
  <div id="pauseMenu">
    <div class="pause-title">Pause</div>
    <button id="continueBtn">Continue</button>
  </div>
  <div id="upgradeMenu">
    <div id="upgradeTitle">Choose an upgrade!</div>
    <div class="upgrade-cards" id="upgradeCards"></div>
  </div>
<script type="module" src="globals.js"></script>
<script type="module" src="skills.js"></script>
<script type="module" src="player.js"></script>
<script type="module" src="enemies.js"></script>
<script type="module" src="game.js"></script>
</body>
</html>
