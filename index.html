<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bouncy Ball Game</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="gameCanvas"></canvas>
  <div id="skillsUI" style="
  position: absolute;
  top: 20px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  flex-direction: row;
  gap: 26px;
  z-index: 12;
"></div>

  <div id="gameOverScreen">
    <div>Game Over!</div>
    <div>Your Score: <span id="finalScore"></span></div>
    <button id="restartBtn">Restart</button>
  </div>
  <div id="upgradeMenu">
    <div id="upgradeTitle">Выбери прокачку!</div>
    <div class="upgrade-cards" id="upgradeCards"></div>
  </div>
<script type="module" src="globals.js"></script>
<script type="module" src="upgrades.js"></script>
<script type="module" src="player.js"></script>
<script type="module" src="enemies.js"></script>
<script type="module" src="game.js"></script>
</body>
</html>
